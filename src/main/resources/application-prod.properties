# Production Environment Configuration

# CORS Configuration - Restrict to specific trusted origins in production
cors.allowed.origins=https://restbill.example.com,https://www.restbill.example.com

# Database Configuration (should be overridden by environment variables in production)
spring.datasource.url=jdbc:postgresql://localhost:5432/RestBil_System
spring.datasource.username=postgres
spring.datasource.password=changeme

# Hibernate settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
